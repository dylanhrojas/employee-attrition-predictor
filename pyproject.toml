[project]
name = "employee-attrition-predictor"
version = "0.1.0"
description = "Attrition predictor for employees"
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "ipykernel",
    "xgboost",
    "joblib",
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic",
    "streamlit",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]