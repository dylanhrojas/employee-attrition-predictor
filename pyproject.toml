[project]
name = "employee-attrition-predictor"
version = "0.1.0"
description = "Attrition predictor for employees"
requires-python = ">=3.14"
dependencies = [
    "pydantic",
]

[project.optional-dependencies]
api = ["fastapi[standard]", "uvicorn[standard]", "scikit-learn", "joblib", "pandas"]
ui = ["streamlit", "requests"]
dev = ["scikit-learn", "xgboost", "matplotlib", "seaborn", "pandas", "numpy", "joblib", "ipykernel", "statsmodels"]
all = ["employee-attrition-predictor[api,ui,dev]"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "schemas*"]